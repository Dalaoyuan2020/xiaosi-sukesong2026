<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小思</title>
<!-- 小思主屏：全屏一对眼睛（风格参考 FluxGarage RoboEyes / Cozmo，代码自写），说话时旁边出字幕，
     待命时底下一行小字轮流提示能帮你做什么，一分钟没人就犯困。臂服务（arm_service/server.py）在 / 提供本页，
     轮询 /state；眼睛看向 tools/eyes/face_watch.py 报的人（/state 的 look）。不联网、不用外部库。
     浏览器全屏：Chrome 打开后按 Cmd+Ctrl+F，或 open -a "Google Chrome" --args --kiosk http://127.0.0.1:8000/ -->
<style>
:root {
  --bg: #15120f; --panel: #221d19; --eye: #7fe3d4; --glow: rgba(127,227,212,.55); --blush: #ff9fb0;
  --ink: #f4ede4; --muted: #a99c8d; --go: #e07a3c; --stop: #d2453a;
  --sub: clamp(26px, 3.4vw, 54px); --hint: clamp(18px, 2vw, 30px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
.screen { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto;
  padding: 14px max(18px, env(safe-area-inset-left)) 16px max(18px, env(safe-area-inset-right)); }
.top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 16px; }
.top b { color: var(--ink); font-size: 20px; letter-spacing: .1em; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #4bbf7f; margin-right: 6px; vertical-align: 1px; }
.dot.off { background: var(--stop); }
.stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
#eyes { width: min(92vw, 150vh); max-height: 100%; overflow: visible; }
#eyes .e { fill: var(--eye); filter: drop-shadow(0 0 14px var(--glow)); }
#eyes .cut { fill: var(--bg); }
#eyes .blush { fill: var(--blush); opacity: .28; transition: opacity .3s; }
#eyes.done .blush, #eyes.listening .blush { opacity: .7; }
#zzz { fill: var(--muted); font-size: 34px; font-weight: 700; opacity: 0; transition: opacity .6s; }
#eyes.sleepy #zzz { opacity: .8; }
@media (prefers-reduced-motion: no-preference) {
  #eyes.sleepy #zzz { animation: float 3s ease-in-out infinite; }
}
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
/* 说话时的字幕：从眼睛右边冒出来，窄屏放到眼睛下面 */
#sub { position: absolute; right: 2%; top: 50%; transform: translate(12px, -50%); max-width: min(34vw, 560px);
  background: var(--panel); border: 2px solid #3a322b; border-radius: 28px; padding: 22px 26px;
  font-size: var(--sub); font-weight: 800; line-height: 1.3; text-wrap: balance; opacity: 0; transition: opacity .35s, transform .35s; }
#sub.show { opacity: 1; transform: translate(0, -50%); }
#sub::before { content: ""; position: absolute; left: -14px; top: 50%; width: 24px; height: 24px; background: var(--panel);
  border-left: 2px solid #3a322b; border-bottom: 2px solid #3a322b; transform: translateY(-50%) rotate(45deg); }
@media (max-aspect-ratio: 4/3) {
  #sub { right: 50%; top: auto; bottom: 2%; transform: translate(50%, 12px); max-width: 92vw; }
  #sub.show { transform: translate(50%, 0); }
  #sub::before { display: none; }
}
.bottom { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 14px; }
#hint { text-align: center; font-size: var(--hint); color: var(--muted); min-height: 1.4em; }
#hint b { color: var(--ink); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: inherit; font-size: clamp(16px, 1.6vw, 22px); font-weight: 700; padding: 12px 22px; border-radius: 999px; border: 0;
  cursor: pointer; background: #2c2520; color: var(--ink); }
button.go { background: var(--go); color: #fff; }
button.stop { background: var(--stop); color: #fff; padding: 12px 30px; }
button.ok { background: #3a9d6a; color: #fff; padding: 12px 34px; font-size: clamp(20px, 2.2vw, 30px); }
button:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--eye); outline-offset: 2px; }
/* 模型切换：右上角「模型」打开一个小面板，每个动作一个下拉框；平时收起，不挡眼睛 */
button.mini { font-size: 14px; font-weight: 600; padding: 5px 12px; margin-right: 12px; background: transparent; color: var(--muted); border: 1px solid currentColor; }
#models { position: fixed; top: 52px; right: max(18px, env(safe-area-inset-right)); width: min(420px, calc(100vw - 36px));
  background: var(--panel); color: var(--ink); border-radius: 16px; padding: 16px 18px; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  display: flex; flex-direction: column; gap: 12px; font-size: 16px; z-index: 5; }
#models label { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
#models select { font: inherit; font-weight: 400; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--muted); background: var(--bg); color: var(--ink); max-width: 100%; }
#models .note { font-size: 13px; color: var(--muted); }
#models h4 { margin: 0; font-size: 13px; color: var(--muted); letter-spacing: .1em; font-weight: 600; }
#models .sw { flex-direction: row; align-items: center; justify-content: space-between; font-weight: 600; }
#models .sw input { width: 22px; height: 22px; accent-color: var(--go); }
#models .sw small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
button.sending { opacity: .6; }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--panel); color: var(--ink);
  padding: 10px 18px; border-radius: 12px; font-size: 18px; opacity: 0; transition: opacity .2s; }
#toast.show { opacity: .95; }
@media (max-width: 640px) { .bottom { grid-template-columns: 1fr; } #hint { order: -1; } }
#eyes .hl, #eyes .visor, #eyes .mouth { display: none; }
body.theme-a #eyes { width: min(66vw, 115vh); transform: translateX(-12vw); }
@media (max-aspect-ratio: 4/3) { body.theme-a #eyes { width: min(92vw, 150vh); transform: none; } }
body.theme-c #eyes { width: min(62vw, 92vh); margin-bottom: 9vh; }
body.theme-b #eyes { width: min(80vw, 130vh); margin-bottom: 8vh; }
/* 方案 B 暖白屏：米白底、深色圆眼睛带高光，字幕放眼睛下面、更大（老人看得清） */
body.theme-b { --bg: #f6f1e7; --panel: #fffdf8; --ink: #2d2620; --muted: #7a6d60; --eye: #2d2620; --glow: rgba(0,0,0,0); }
body.theme-b #eyes .e { rx: 55; filter: none; }
body.theme-b #eyes .hl { display: inline; fill: #fff; }
body.theme-b #sub, body.theme-c #sub { right: 50%; top: auto; bottom: 0; transform: translate(50%, 12px); max-width: 90vw; text-align: center; }
body.theme-b #sub.show, body.theme-c #sub.show { transform: translate(50%, 0); }
body.theme-b #sub::before, body.theme-c #sub::before { display: none; }
body.theme-b #sub { border-color: #e6dccb; box-shadow: 0 6px 20px rgba(45,38,32,.12); }
body.theme-b button { background: #e9e0d2; color: var(--ink); } body.theme-b button.go { background: var(--go); color: #fff; } body.theme-b button.stop { background: var(--stop); color: #fff; } body.theme-b button.ok, body.theme-c button.ok { background: #3a9d6a; color: #fff; }
/* 方案 C 机器人头：暖橙色头壳 + 深色面罩屏，里面一对发光眼睛和一张会动的小嘴 */
body.theme-c { --bg: #f3e6d6; --panel: #fffaf3; --ink: #2d2620; --muted: #7a6d60; }
body.theme-c #eyes .visor { display: inline; }
body.theme-c #eyes .mouth { display: inline; fill: none; stroke: var(--eye); stroke-width: 6; stroke-linecap: round; filter: drop-shadow(0 0 6px var(--glow)); }
body.theme-c #eyes .cut { fill: #1d1a17; }
body.theme-c #eyes .blush { display: none; }
body.theme-c button { background: #e8d8c4; color: var(--ink); } body.theme-c button.go { background: var(--go); color: #fff; } body.theme-c button.stop { background: var(--stop); color: #fff; }
</style>
</head>
<body>
<div class="screen">
  <div class="top"><b>小思</b><span><button id="b-models" class="mini" type="button" aria-expanded="false">设置</button><span id="dot" class="dot"></span><span id="conn">连接中…</span></span></div>
  <div class="stage">
    <svg id="eyes" class="idle" viewBox="0 0 400 220" role="img" aria-label="小思的眼睛">
      <g class="visor"><rect x="-30" y="-28" width="460" height="276" rx="70" fill="#e07a3c"/><rect x="0" y="-4" width="400" height="228" rx="52" fill="#1d1a17"/></g>
      <g id="eyeL"><rect class="e" x="-55" y="-60" width="110" height="120" rx="30"/><circle class="hl" cx="-18" cy="-24" r="14"/></g>
      <g id="eyeR"><rect class="e" x="-55" y="-60" width="110" height="120" rx="30"/><circle class="hl" cx="-18" cy="-24" r="14"/></g>
      <path id="mouth" class="mouth" d="M180 196 Q200 206 220 196"/>
      <ellipse id="blushL" class="blush" cx="68" cy="185" rx="17" ry="7"/>
      <ellipse id="blushR" class="blush" cx="332" cy="185" rx="17" ry="7"/>
      <ellipse id="cutL" class="cut" cx="0" cy="0" rx="0" ry="0"/>
      <ellipse id="cutR" class="cut" cx="0" cy="0" rx="0" ry="0"/>
      <text id="zzz" x="345" y="40">z z Z</text>
    </svg>
    <div id="sub" aria-live="polite"></div>
  </div>
  <div class="bottom">
    <div class="btns"><button id="b-cup" class="go">递杯子</button><button id="b-snack" class="go">拿零食</button><button id="b-shake" class="go">握手</button><button id="b-release" hidden>松手</button>
      <button id="b-yes" class="ok" hidden>确定</button><button id="b-no" hidden>取消</button></div>
    <div id="hint"></div>
    <button id="b-stop" class="stop">停</button>
  </div>
</div>
<div id="models" hidden></div>
<div id="toast" role="status"></div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const WORKING = ["going", "working", "grasping", "grasped", "delivering", "returning", "waving"];
  const HINTS = ["我可以帮你：<b>递杯子</b>", "我可以帮你：<b>拿零食</b>", "想握握手？说<b>「小思握手」</b>", "叫我：<b>「小思小思」</b>", "说<b>「小思停下」</b>，我马上停"];
  const WAKE_REPLY = { "小思小思": "我在呢～", "小思停下": "好，停下" };
  const SLEEP_AFTER = 60;                                 // 秒：没人、没叫，就犯困
  const t0 = Date.now() / 1000;
  let lines = { phases: {}, objects: {} }, lastSeq = null, doneUntil = 0, lastHeardAt = 0, lastSaidAt = 0, lastFaceAt = t0, lastActivity = t0;
  let eyeMode = "idle", gaze = { x: 0, y: 0, fresh: false }, cur = { x: 0, y: 0, h: 0.85 }, blinkT = 0, glanceUntil = 0, subTimer = 0, hintI = 0;

  fetch("lines").then((r) => r.json()).then((j) => { lines = j; }).catch(() => {});
  // 方案切换：?theme=a|b|c（默认 b）。演示截图：?demo=listening&say=我在呢～（不轮询，定格在这个状态）
  const Q = new URLSearchParams(location.search);
  document.body.classList.add("theme-" + (Q.get("theme") || "b"));   // 默认 B 暖白萌眼（11/01 吕博选）
  const DEMO = Q.get("demo");

  function toast(t) { const el = $("toast"); el.textContent = t; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); }
  function press(id, path, body) {                       // 动作按钮：按下就变灰，回话了再恢复，防连点
    const b = $(id); if (b.classList.contains("sending")) return;
    b.classList.add("sending");
    post(path, body).finally(() => b.classList.remove("sending"));
  }
  function post(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) })
      .then((r) => r.json()).then((j) => { if (!j.ok) toast(j.error || "现在还不行"); return j; })
      .catch(() => toast("连不上臂服务：看看终端里 tools/xiaosi_start.sh 还在不在跑"));
  }
  // 先问再做：按钮和语音一样，先发请求，等「确定」才动臂
  $("b-cup").onclick = () => press("b-cup", "request", { action: "pick", object: "cup" });
  $("b-snack").onclick = () => press("b-snack", "request", { action: "pick", object: "snack" });
  $("b-shake").onclick = () => press("b-shake", "request", { action: "shake" });
  $("b-yes").onclick = () => press("b-yes", "confirm");
  $("b-no").onclick = () => press("b-no", "cancel");
  $("b-stop").onclick = () => post("stop");
  $("b-release").onclick = () => post("release");
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" || e.key === " ") post("stop"); });

  function say(text) {                                   // 侧边字幕：冒出来，6 秒后淡出
    if (!text) return;
    const el = $("sub"); el.textContent = text; el.classList.add("show");
    clearTimeout(subTimer); subTimer = setTimeout(() => el.classList.remove("show"), 6000);
  }
  // 模型面板：GET /models 列出每个动作能选的模型；选了就 POST /model。没下载的选不了；干活时不让换。
  const SKILL_NAME = { cup: "递杯子", snack: "拿零食", shake: "握手" };
  const FEATURE_NAME = { wake_gesture: ["叫醒点头", "叫「小思小思」时臂点一下头（臂没电时关掉）"],
                         eyes_follow: ["眼睛跟人", "屏幕上的眼睛跟着摄像头里的人转"],
                         chat: ["自由聊天", "叫醒后可以随便说一句（要 MiMo key）"] };
  function renderFeatures(box, f) {
    const h = document.createElement("h4"); h.textContent = "功能开关"; box.append(h);
    for (const [k, [name, tip]] of Object.entries(FEATURE_NAME)) {
      if (!(k in f)) continue;
      const lab = document.createElement("label"); lab.className = "sw";
      const t = document.createElement("span"); t.textContent = name;
      const sm = document.createElement("small"); sm.textContent = tip; t.append(sm);
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "feat-" + k; cb.checked = !!f[k];
      cb.onchange = () => post("feature", { name: k, on: cb.checked }).then((r) => { if (r && r.ok) toast(name + (cb.checked ? "：开" : "：关")); else cb.checked = !cb.checked; });
      lab.append(t, cb); box.append(lab);
    }
  }
  function renderModels() {
    Promise.all([fetch("features").then((r) => r.json()).catch(() => ({})), fetch("models").then((r) => r.json())]).then(([fj, j]) => {
      const box = $("models"); box.replaceChildren();
      if (fj && fj.features) renderFeatures(box, fj.features);
      const mh = document.createElement("h4"); mh.textContent = "每个动作用哪个模型"; box.append(mh);
      const sk = j.skills || {};
      if (!Object.keys(sk).length) { const n0 = document.createElement("div"); n0.className = "note"; n0.textContent = "现在的后端不能换模型（要 ARM_BACKEND=skills）"; box.append(n0); return; }
      for (const [name, info] of Object.entries(sk)) {
        const lab = document.createElement("label"); lab.textContent = SKILL_NAME[name] || name;
        const sel = document.createElement("select"); sel.id = "model-" + name; sel.disabled = !!j.busy;
        for (const m of info.models) {
          const o = document.createElement("option"); o.value = m.name; o.textContent = m.name + (m.ready ? "" : "（没下载）");
          o.disabled = !m.ready; o.selected = m.name === info.current; sel.append(o);
        }
        sel.onchange = () => post("model", { skill: name, model: sel.value }).then((r) => { if (r && r.ok) toast("「" + (SKILL_NAME[name] || name) + "」换成：" + r.model); renderModels(); });
        lab.append(sel); box.append(lab);
      }
      const n = document.createElement("div"); n.className = "note";
      n.textContent = j.busy ? "正在干活，做完再换。" : "换完下一次动作就用新模型。握手换模型后，先在终端对它跑一次 --sim。";
      box.append(n);
    }).catch(() => { $("models").textContent = "连不上臂服务，换不了模型"; });
  }
  $("b-models").onclick = () => {
    const box = $("models"), open = box.hidden;
    box.hidden = !open; $("b-models").setAttribute("aria-expanded", String(open));
    if (open) renderModels();
  };

  function lineFor(s) {
    const over = ((lines.object_phases || {})[s.object]) || {};
    const tpl = s.phase in over ? over[s.phase] : (lines.phases || {})[s.phase];
    if (!tpl) return null;
    let t = tpl.replace("{object}", (lines.objects || {})[s.object] || "东西");
    if (s.phase === "failed") t += s.last_result || "";
    return t;
  }
  function blinkTwice() { blinkT = performance.now(); setTimeout(() => { blinkT = performance.now(); }, 280); }

  function view(s) {
    const now = Date.now() / 1000;
    let mode = "idle";
    if (WORKING.includes(s.phase)) mode = "working";
    else if (s.phase === "waiting_release" || s.phase === "releasing") mode = "waiting";
    else if (s.phase === "stopped" || s.phase === "failed") mode = "stopped";
    else if (s.phase === "done" && now < doneUntil) mode = "done";
    if (s.heard_at && s.heard_at > lastHeardAt) {          // 新听到一句：先眨两下，再回话
      const first = lastHeardAt === 0 && now - s.heard_at > 10;
      lastHeardAt = s.heard_at;
      if (!first) { lastActivity = now; say(WAKE_REPLY[s.heard] || "收到～"); blinkTwice(); }
    }
    if (s.said_at && s.said_at > lastSaidAt) {            // 自由对话：小思回的话当字幕
      const first = lastSaidAt === 0 && now - s.said_at > 10;
      lastSaidAt = s.said_at;
      if (!first) { lastActivity = now; say(s.said); }
    }
    const pending = s.pending && s.pending.expires > now ? s.pending : null;
    if (pending) mode = "listening";                     // 等你确认：睁大眼睛看着你
    if (mode === "idle" && now - lastHeardAt < 5) mode = "listening";
    if (s.seq !== lastSeq) {
      if (lastSeq !== null) {
        if (s.phase === "done") doneUntil = now + 4;
        if (s.phase === "going") glanceUntil = now + 1.2;   // 想一下：往右上看
        say(lineFor(s));
        lastActivity = now;
      }
      lastSeq = s.seq;
    }
    const lk = s.look || {};
    if (lk.found && now - lk.t < 1.5) {
      if (eyeMode === "sleepy") blinkTwice();                // 看到人就醒
      gaze = { x: lk.x, y: lk.y, fresh: true }; lastFaceAt = now;
    } else if (gaze.fresh) gaze = { x: gaze.x, y: gaze.y, fresh: false };
    if (mode === "idle" && now - Math.max(lastActivity, lastFaceAt) > SLEEP_AFTER) mode = "sleepy";
    if (now < glanceUntil) gaze = { x: 0.7, y: -0.8, fresh: true };
    eyeMode = mode;
    $("eyes").setAttribute("class", mode);
    $("b-cup").disabled = $("b-snack").disabled = $("b-shake").disabled = !!s.busy;
    $("b-release").hidden = mode !== "waiting";
    $("b-yes").hidden = $("b-no").hidden = !pending;
    $("b-cup").hidden = $("b-snack").hidden = !!pending;
    const hint = $("hint");
    if (pending) hint.innerHTML = "看看旁边没有人，说<b>「小思确定」</b>（" + Math.ceil(pending.expires - now) + " 秒）";
    else if (s.heard && now - s.heard_at < 8) hint.innerHTML = "我听到：<b>「" + String(s.heard).replace(/[<>&]/g, "") + "」</b>";
    else if (mode === "sleepy") hint.innerHTML = "我打个盹儿，叫我<b>「小思小思」</b>就醒";
    else if (mode === "idle" || mode === "listening") hint.innerHTML = HINTS[hintI % HINTS.length];
    else if (mode === "working") hint.textContent = "我在做，慢慢来";
    else if (mode === "waiting") hint.innerHTML = "拿稳了就说<b>「小思松手」</b>";
    else hint.textContent = "";
    $("conn").textContent = (s.mode === "fake" ? "假动作模式（臂不动）" : s.connected ? "机械臂已连" : "机械臂没连上")
      + (s.model && WORKING.includes(s.phase) ? " · " + s.model : "");
    $("dot").className = s.connected ? "dot" : "dot off";
  }
  setInterval(() => { hintI++; }, 3500);

  // 眼睛：整只眼睛跟着 gaze 动，往一边看那侧变大（好奇）；随机眨眼；状态决定眼型
  const eL = $("eyeL"), eR = $("eyeR");
  const SHAPE = { idle: 0.85, listening: 1.12, working: 0.6, waiting: 1.0, done: 1.0, stopped: 0.3, sleepy: 0.22 };
  function frame(ts) {
    const gx = Math.max(-1, Math.min(1, gaze.x)), gy = Math.max(-1, Math.min(1, gaze.y));
    cur.x += (gx * 55 - cur.x) * 0.14; cur.y += (gy * 28 - cur.y) * 0.14;
    let h = SHAPE[eyeMode] || 0.85;
    if (blinkT && ts - blinkT < 150) h *= 0.08;
    if (eyeMode === "sleepy") h *= 1 + 0.15 * Math.sin(ts / 900);               // 犯困：眼皮一沉一浮
    cur.h += (h - cur.h) * 0.3;
    const cL = 1 + Math.max(0, -cur.x / 55) * 0.18, cR = 1 + Math.max(0, cur.x / 55) * 0.18;
    const y = 110 + cur.y + (eyeMode === "sleepy" ? 12 : 0);
    eL.setAttribute("transform", "translate(" + (120 + cur.x).toFixed(1) + " " + y.toFixed(1) + ") scale(" + cL.toFixed(3) + " " + (cur.h * cL).toFixed(3) + ")");
    eR.setAttribute("transform", "translate(" + (280 + cur.x).toFixed(1) + " " + y.toFixed(1) + ") scale(" + cR.toFixed(3) + " " + (cur.h * cR).toFixed(3) + ")");
    $("blushL").setAttribute("cx", (68 + cur.x).toFixed(1)); $("blushR").setAttribute("cx", (332 + cur.x).toFixed(1));
    $("blushL").setAttribute("cy", (y + 66).toFixed(1)); $("blushR").setAttribute("cy", (y + 66).toFixed(1));
    const happy = eyeMode === "done" ? 1 : 0;                                    // 完成 = 笑眼 ^ ^
    [["cutL", 120], ["cutR", 280]].forEach(([id, x0]) => {
      const c = $(id);
      c.setAttribute("cx", (x0 + cur.x).toFixed(1)); c.setAttribute("cy", (y + 62).toFixed(1));
      c.setAttribute("rx", (happy * 80).toFixed(1)); c.setAttribute("ry", (happy * 62).toFixed(1));
    });
    const talking = $("sub").classList.contains("show");                         // C 方案的小嘴：说话时一张一合
    const m = talking ? 6 + 8 * Math.abs(Math.sin(ts / 110)) : 10;
    $("mouth").setAttribute("d", "M180 196 Q200 " + (196 + m).toFixed(1) + " 220 196" + (talking ? " Q200 " + (196 - m * 0.2).toFixed(1) + " 180 196" : ""));
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  (function blinkLoop() {
    setTimeout(() => { if (!DEMO && eyeMode !== "done" && eyeMode !== "sleepy") blinkT = performance.now(); blinkLoop(); }, 2600 + Math.random() * 3400);
  })();
  setInterval(() => {                                       // 没人时偶尔左右看看，显得是活的
    if (!DEMO && !gaze.fresh && eyeMode === "idle") gaze = { x: (Math.random() - 0.5) * 1.2, y: (Math.random() - 0.5) * 0.4, fresh: false };
  }, 3200);

  if (DEMO) {
    eyeMode = DEMO; $("eyes").setAttribute("class", DEMO); blinkT = 0;
    if (Q.get("say")) { const el = $("sub"); el.textContent = Q.get("say"); el.classList.add("show"); }
    $("hint").innerHTML = Q.get("hint") || HINTS[0];
    gaze = { x: parseFloat(Q.get("x") || "0"), y: parseFloat(Q.get("y") || "0"), fresh: true };
    $("conn").textContent = "机械臂已连"; return;
  }
  function poll() {
    fetch("state").then((r) => r.json()).then(view)
      .catch(() => { $("conn").textContent = "连不上臂服务（tools/xiaosi_start.sh 开着吗？）"; $("dot").className = "dot off"; })
      .finally(() => setTimeout(poll, 300));
  }
  poll();
})();
</script>
</body>
